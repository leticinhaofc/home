<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VIP Delas Gallery</title>
    <script type="text/javascript">
      // [Auto-Discovery Engine & SPA Hack]
      // Captura o erro 404 do GitHub Pages e redireciona de volta para o index.html
      // envelopando a rota profunda na querystring "p" para o React Router recuperar.
      
      var pathSegmentsToKeep = 0;
      var l = window.location;
      
      // Se estiver rodando no github.io, o primeiro segmento é o repositório (base)
      if (l.hostname.indexOf('.github.io') > -1) {
        pathSegmentsToKeep = 1;
      }
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
